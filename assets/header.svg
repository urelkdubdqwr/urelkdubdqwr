<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="ht hd">
  <title id="ht">urelkdubdqwr — ONAR &amp; ME</title>
  <desc id="hd">A night sky of scorpio over a golden city — pixel robot with eagle wings rising from a coin vault, phoenix trail behind it. Wordmark: ONAR &amp; ME. Web3 bots, money printers, agent tools.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#050409"/>
      <stop offset="0.55" stop-color="#0E0A1C"/>
      <stop offset="1"    stop-color="#241428"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="300" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1022"/>
      <stop offset="1" stop-color="#080510"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2A92C" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E2A92C" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D67A"/>
      <stop offset="1" stop-color="#C78F1F"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="120" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#FF5E3A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF8A3C" stop-opacity="0.6"/>
      <stop offset="1"   stop-color="#E2A92C" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#050409" stop-opacity="0.93"/>
      <stop offset="0.55" stop-color="#050409" stop-opacity="0.8"/>
      <stop offset="1"    stop-color="#050409" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .wm   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
              font-size: 88px; font-weight: 800; letter-spacing: -3px; fill: #F2F3F7; }
      .amp  { fill: url(#gold); }
      .sub  { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
              font-size: 16px; letter-spacing: 4px; fill: #8A93A6; }
      .tag  { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
              font-size: 13px; letter-spacing: 1.5px; fill: #8A93A6; }
      .px   { shape-rendering: crispEdges; }
    ]]></style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect y="300" width="1200" height="140" fill="url(#ground)"/>

  <!-- scorpio constellation, top right -->
  <g stroke="#7C3AED" stroke-width="1.2" opacity="0.5" fill="none">
    <path d="M905 62 L935 78 L968 74 L996 92 L1018 118 L1050 132 L1078 122 L1090 98"/>
  </g>
  <g fill="#C9B6F5">
    <circle cx="905" cy="62" r="2"/><circle cx="935" cy="78" r="2.4"/><circle cx="968" cy="74" r="2"/>
    <circle cx="996" cy="92" r="2.6"/><circle cx="1018" cy="118" r="2"/><circle cx="1050" cy="132" r="2.2"/>
    <circle cx="1078" cy="122" r="2"/><circle cx="1090" cy="98" r="3" fill="#FF9E7A"/>
  </g>

  <!-- stars -->
  <g fill="#D9DEEA" opacity="0.7">
    <circle cx="120" cy="60" r="1.3"/><circle cx="240" cy="110" r="1"/><circle cx="330" cy="45" r="1.5"/>
    <circle cx="415" cy="140" r="0.9"/><circle cx="520" cy="70" r="1.2"/><circle cx="640" cy="40" r="1"/>
    <circle cx="705" cy="125" r="1.4"/><circle cx="800" cy="80" r="1"/><circle cx="880" cy="35" r="1.3"/>
    <circle cx="1140" cy="60" r="1.2"/><circle cx="1160" cy="150" r="1"/><circle cx="580" cy="160" r="0.8"/>
  </g>

  <!-- golden city skyline -->
  <g fill="#120C1E">
    <rect x="700" y="228" width="26" height="72"/><rect x="740" y="196" width="34" height="104"/>
    <rect x="790" y="244" width="20" height="56"/><rect x="826" y="164" width="44" height="136"/>
    <rect x="886" y="222" width="24" height="78"/><rect x="926" y="200" width="30" height="100"/>
    <rect x="972" y="246" width="18" height="54"/><rect x="1004" y="182" width="36" height="118"/>
    <rect x="1056" y="230" width="22" height="70"/><rect x="1094" y="208" width="28" height="92"/>
    <rect x="1138" y="238" width="24" height="62"/>
  </g>
  <!-- tallest tower: eagle standard -->
  <path d="M848 164 L848 138 M838 148 L848 138 L858 148" stroke="url(#gold)" stroke-width="2.5" fill="none"/>
  <!-- lit windows, gold -->
  <g fill="#E2A92C" opacity="0.6">
    <rect x="748" y="210" width="4" height="4"/><rect x="760" y="228" width="4" height="4"/>
    <rect x="836" y="180" width="4" height="4"/><rect x="852" y="204" width="4" height="4"/>
    <rect x="934" y="216" width="4" height="4"/><rect x="1012" y="198" width="4" height="4"/>
    <rect x="1024" y="232" width="4" height="4"/><rect x="1102" y="224" width="4" height="4"/>
  </g>

  <!-- phoenix ember trail rising from the vault -->
  <path d="M600 322 C560 280 596 236 574 196 C556 162 580 132 566 104"
        stroke="url(#ember)" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M618 322 C646 268 612 230 640 182 C660 150 640 128 656 108"
        stroke="url(#ember)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <g fill="#FFB84C">
    <circle cx="592" cy="150" r="2.4" opacity="0.9"/><circle cx="610" cy="118" r="1.8" opacity="0.7"/>
    <circle cx="566" cy="196" r="2" opacity="0.8"/><circle cx="634" cy="148" r="2.2" opacity="0.8"/>
    <circle cx="648" cy="94" r="1.6" opacity="0.6"/><circle cx="580" cy="88" r="1.8" opacity="0.7"/>
  </g>
  <!-- phoenix itself, small, high in the sky -->
  <g transform="translate(560,80) scale(1.6)" fill="#FFAE5E">
    <path d="M0 0 C-16 -10 -30 -6 -38 2 C-26 2 -16 6 -8 10 Z" opacity="0.9"/>
    <path d="M0 0 C16 -10 30 -6 38 2 C26 2 16 6 8 10 Z" opacity="0.9"/>
    <path d="M-4 4 L4 4 L0 20 Z"/>
    <circle cx="0" cy="-1" r="3.4" fill="#FFD98A"/>
  </g>

  <!-- coin vault mound -->
  <path d="M470 340 Q600 288 740 340 L740 440 L470 440 Z" fill="#161021"/>
  <g>
    <ellipse cx="540" cy="336" rx="34" ry="12" fill="url(#gold)"/>
    <ellipse cx="540" cy="330" rx="34" ry="12" fill="#F5D67A"/>
    <ellipse cx="662" cy="342" rx="30" ry="10" fill="url(#gold)"/>
    <ellipse cx="662" cy="337" rx="30" ry="10" fill="#F5D67A"/>
    <ellipse cx="600" cy="318" rx="26" ry="9" fill="url(#gold)"/>
    <ellipse cx="600" cy="313" rx="26" ry="9" fill="#F5D67A"/>
    <text x="540" y="336" font-size="11" font-weight="700" text-anchor="middle" fill="#7A5A10">$</text>
    <text x="600" y="319" font-size="9"  font-weight="700" text-anchor="middle" fill="#7A5A10">$</text>
  </g>
  <!-- falling coins -->
  <g fill="url(#gold)">
    <circle cx="700" cy="270" r="6"/><circle cx="716" cy="300" r="5"/><circle cx="688" cy="316" r="4"/>
    <circle cx="508" cy="272" r="5"/><circle cx="494" cy="302" r="4"/>
  </g>

  <!-- pixel robot with eagle wings, standing on the vault -->
  <g class="px" transform="translate(584,232)">
    <!-- wings -->
    <path d="M-8 18 L-64 -8 L-52 14 L-72 10 L-46 30 L-10 30 Z" fill="#3D2A66" stroke="#7C3AED" stroke-width="2"/>
    <path d="M40 18 L96 -8 L84 14 L104 10 L78 30 L42 30 Z" fill="#3D2A66" stroke="#7C3AED" stroke-width="2"/>
    <!-- head -->
    <rect x="4"  y="-8"  width="24" height="20" fill="#1B2333" stroke="#4A5A75" stroke-width="2"/>
    <rect x="8"  y="-4"  width="6"  height="6"  fill="#FF8A3C"/>
    <rect x="18" y="-4"  width="6"  height="6"  fill="#FF8A3C"/>
    <!-- crown spike (phoenix crest) -->
    <rect x="13" y="-16" width="6" height="8" fill="#FF8A3C"/>
    <!-- torso: money screen -->
    <rect x="0"  y="12"  width="32" height="26" fill="#141B28" stroke="#4A5A75" stroke-width="2"/>
    <text x="16" y="30" font-size="14" font-weight="800" text-anchor="middle" fill="url(#gold)" shape-rendering="auto">$</text>
    <!-- arms -->
    <rect x="-8"  y="14" width="8" height="18" fill="#1B2333"/>
    <rect x="32"  y="14" width="8" height="18" fill="#1B2333"/>
    <!-- legs -->
    <rect x="4"   y="38" width="8" height="12" fill="#1B2333"/>
    <rect x="20"  y="38" width="8" height="12" fill="#1B2333"/>
  </g>

  <!-- scorpion at the foot of the vault, left -->
  <g transform="translate(452,372)" fill="none" stroke="#A97DF5" stroke-width="2.6" opacity="0.95">
    <path d="M0 0 h22 q8 0 12 -6 q4 -6 12 -6"/>
    <path d="M40 -12 q8 0 10 -8 M50 -20 L44 -26 M50 -20 L58 -26"/>
    <path d="M4 0 L-4 8 M10 0 L8 10 M16 0 L20 9"/>
  </g>

  <!-- text scrim -->
  <rect width="820" height="440" fill="url(#scrim)"/>

  <!-- wordmark -->
  <text x="72" y="196" class="wm">ONAR <tspan class="amp">&amp;</tspan> ME</text>
  <text x="76" y="238" class="sub">SCORPIO · EAGLE · PHOENIX</text>
  <text x="76" y="268" class="tag">AI robot. web3. money money money.</text>

  <!-- frame edge -->
  <rect x="1" y="1" width="1198" height="438" fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>
