<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="10 projects shipped, 340 skills in inventory, 15 jobs in the cron army">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C1018"/>
      <stop offset="1" stop-color="#07060F"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="48" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FBF3DC"/>
      <stop offset="0.52" stop-color="#E8C567"/>
      <stop offset="1"    stop-color="#C78F1F"/>
    </linearGradient>
    <style><![CDATA[
      .num  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
              font-size: 58px; font-weight: 600; letter-spacing: -1.2px;
              text-anchor: middle; fill: url(#metal); }
      .lbl  { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
              font-size: 15px; letter-spacing: 2.6px; text-anchor: middle; fill: #79828C; }
      .div  { stroke: #1C2330; stroke-width: 1; }
    ]]></style>
  </defs>
  <rect width="1200" height="170" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="1199" height="169" fill="none" stroke="#161C28"/>
  <line x1="400" y1="42" x2="400" y2="128" class="div"/>
  <line x1="800" y1="42" x2="800" y2="128" class="div"/>
  <text x="200" y="102" class="num">10+</text>
  <text x="200" y="134" class="lbl">PROJECTS SHIPPED</text>
  <text x="600" y="102" class="num">340</text>
  <text x="600" y="134" class="lbl">SKILLS IN INVENTORY</text>
  <text x="1000" y="102" class="num">15</text>
  <text x="1000" y="134" class="lbl">JOBS IN THE CRON ARMY</text>
</svg>
