<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="presentation">
  <defs>
    <!-- scorpion-tail zigzag + coin dots: the vault's signature -->
    <pattern id="tail" width="60" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 20 H20 L26 12 L32 26 L38 14 H60"
            fill="none" stroke="#E2A92C" stroke-width="1.8" stroke-linecap="square"/>
      <circle cx="46" cy="8" r="1.6" fill="#7C3AED"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.84" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="34" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="34" fill="url(#tail)" mask="url(#m)"/>
</svg>
